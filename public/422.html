<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>422 — Changement Rejeté</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #171717;
      color: #ffff00;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 1rem;
    }
    .container h1 {
      font-size: 8rem;
      margin: 0;
    }
    .container p {
      font-size: 1.25rem;
      margin: 0.5rem 0 1.5rem;
    }
    .container a {
      color: #ffff00;
      text-decoration: none;
      border: 2px solid #ffff00;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .container a:hover {
      background-color: #ffff00;
      color: #171717;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>422</h1>
    <p>Oups ! Le changement a été rejeté.</p>
    <a href="/">Retour à l’accueil</a>
  </div>
</body>
</html>
